name: Sync SPDX license library

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/sync_spdx_licenses.py"
      - ".github/workflows/sync-spdx-licenses.yml"

permissions:
  contents: write

concurrency:
  group: spdx-license-library
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download official SPDX library
        run: python tools/sync_spdx_licenses.py --output licenses/SPDX
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add licenses/SPDX
          if git diff --cached --quiet; then
            echo "SPDX library is already up to date."
          else
            git commit -m "Sync official SPDX license library"
            git push
          fi
